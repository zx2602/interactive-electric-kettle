<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Version 1 — Electric Kettle State &amp; Control Flow Model</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Version 1 — Electric Kettle State &amp; Control Flow Model</h1>
    <p>Press a control to change the kettle’s state.</p>

    <section aria-labelledby="state-heading">
      <h2 id="state-heading">Current state</h2>
      <div class="state-display" role="status" aria-live="polite" aria-atomic="true">
        <p>Lid: <strong id="lid-display">Closed</strong></p>
        <p>Target Temperature: <strong id="temperature-display">70°C</strong></p>
        <p>Status: <strong id="heating-display">Stopped</strong></p>
      </div>
    </section>

    <section aria-labelledby="controls-heading">
      <h2 id="controls-heading">Control panel</h2>
      <div class="controls">
        <button id="open-button" type="button">OPEN</button>
        <button id="boil-button" type="button">BOIL</button>
        <button id="set-temp-button" type="button">SET TEMP</button>
        <button id="start-stop-button" type="button">START / STOP</button>
      </div>
    </section>
    <p class="note">The temperature shown is the selected target. This model does not simulate water heating.</p>
  </main>
</body>
</html>
